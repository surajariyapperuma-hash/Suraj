<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>තොරතුරු තාක්ෂණ ප්‍රශ්නාවලිය</title>

<!-- Sinhala Font -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;700;900&display=swap" rel="stylesheet">

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Noto Sans Sinhala',sans-serif;
    background:#ececec;
    min-height:100vh;
    width:100%;
    overflow-x:hidden;

    display:flex;
    justify-content:center;
    align-items:flex-start;

    padding:20px;
}

.quiz-card{
    width:100%;
    max-width:700px;

    background:white;
    border-radius:20px;

    padding:25px;

    box-shadow:
    0 10px 30px rgba(0,0,0,0.08);

    animation:fade 0.4s ease;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0px);
    }
}

.option-button{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #d1d5db;

    background:#f9fafb;

    cursor:pointer;

    transition:0.2s;
    font-size:15px;
    text-align:left;
}

.option-button:hover{
    background:#dbeafe;
}

.correct-answer{
    background:#22c55e !important;
    color:white !important;
}

.incorrect-answer{
    background:#ef4444 !important;
    color:white !important;
}

.disabled{
    pointer-events:none;
    opacity:0.9;
}

#timer-progress{
    transition:1s linear;
}

input{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #d1d5db;
    outline:none;
}

input:focus{
    border-color:#2563eb;
}

button{
    border:none;
}

.main-btn{
    width:100%;
    padding:14px;
    border-radius:14px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    transition:0.2s;
}

.main-btn:hover{
    transform:scale(1.01);
}

.blue{
    background:#2563eb;
}

.blue:hover{
    background:#1d4ed8;
}

.green{
    background:#16a34a;
}

.green:hover{
    background:#15803d;
}

.gray{
    background:#e5e7eb;
    color:#374151;
}

.hidden{
    display:none;
}

</style>
</head>

<body>

<div class="quiz-card">

    <h1 class="text-3xl font-black text-center text-gray-800 mb-2">
        තොරතුරු තාක්ෂණ ප්‍රශ්නාවලිය
    </h1>

    <p class="text-center text-blue-700 font-bold mb-6">
        NextGen ICT By Suraj
    </p>

    <!-- START -->
    <div id="start-screen">

        <div class="mb-4">
            <label class="block mb-2 font-semibold">
                ශිෂ්‍යයාගේ නම
            </label>

            <input
            type="text"
            id="student-name"
            placeholder="ඔබගේ නම">
        </div>

        <div class="mb-5">
            <label class="block mb-2 font-semibold">
                පන්තිය
            </label>

            <input
            type="text"
            id="student-class"
            placeholder="ඔබගේ පන්තිය">
        </div>

        <button
        onclick="startQuiz()"
        class="main-btn blue">
            Start Quiz
        </button>

    </div>

    <!-- TIMER -->
    <div id="timer-display" class="hidden mb-5">

        <div class="w-full h-3 bg-gray-200 rounded-full overflow-hidden mb-2">

            <div
            id="timer-progress"
            class="h-3 bg-red-500"
            style="width:100%">
            </div>

        </div>

        <p class="text-center text-sm font-semibold text-gray-600">
            <span id="time-left">90:00</span>
        </p>

    </div>

    <!-- QUIZ -->
    <div id="quiz-container" class="hidden"></div>

    <!-- RESULTS -->
    <div id="results-container" class="hidden">

        <div
        id="result-card-to-capture"
        class="bg-cyan-50 border-4 border-cyan-400 rounded-2xl p-6 mb-5">

            <h2 class="text-3xl font-black text-center text-blue-800 mb-4">
                ප්‍රතිඵලය
            </h2>

            <div class="text-center mb-4">

                <p class="text-lg font-bold">
                    නම :
                    <span id="display-student-name"></span>
                </p>

                <p class="text-md text-gray-600">
                    පන්තිය :
                    <span id="display-student-class"></span>
                </p>

            </div>

            <p
            id="correct-answers-count"
            class="text-center text-lg font-bold mb-2">
            </p>

            <p
            id="final-percentage"
            class="text-center text-4xl font-black text-green-600 mb-3">
            </p>

            <p
            id="result-date"
            class="text-center text-sm text-gray-500">
            </p>

        </div>

        <button
        onclick="captureResultsAsImage()"
        class="main-btn green mb-3">
            Download Result
        </button>

        <button
        onclick="resetQuizState()"
        class="main-btn blue">
            Restart
        </button>

    </div>

</div>

<script>

/* SETTINGS */

const ENABLE_TIMER = true;

const TOTAL_MINUTES = 90;

const TIME_LIMIT = TOTAL_MINUTES * 60;

const ENABLE_SHUFFLE = true;

/* VARIABLES */

let currentQuestionIndex = 0;

let score = 0;

let quizData = [];

let timerInterval;

let timeRemaining = TIME_LIMIT;

let studentName = '';

let studentClass = '';

/* SAMPLE QUESTIONS */

const originalQuizData = [

{
question:"Binary 1010 හි Decimal අගය කුමක්ද?",
correct:"10",
wrong_answers:["8","12","14","16"]
},

{
question:"Decimal 15 හි Binary අගය කුමක්ද?",
correct:"1111",
wrong_answers:["1010","1100","1001","1110"]
},

{
question:"1 Byte එකක bits ගණන කීයද?",
correct:"8",
wrong_answers:["4","16","32","64"]
}

];

/* SHUFFLE */

function shuffleArray(array){

for(let i=array.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[array[i],array[j]]=[array[j],array[i]];

}

return array;

}

/* START QUIZ */

function startQuiz(){

studentName =
document.getElementById("student-name").value.trim();

studentClass =
document.getElementById("student-class").value.trim();

if(!studentName || !studentClass){

alert("නම සහ පන්තිය ඇතුළත් කරන්න");

return;

}

quizData=[...originalQuizData];

if(ENABLE_SHUFFLE){

shuffleArray(quizData);

}

document
.getElementById("start-screen")
.classList.add("hidden");

document
.getElementById("quiz-container")
.classList.remove("hidden");

if(ENABLE_TIMER){

document
.getElementById("timer-display")
.classList.remove("hidden");

startTimer();

}

renderQuestion();

}

/* TIMER */

function startTimer(){

clearInterval(timerInterval);

updateTimerUI();

timerInterval=setInterval(()=>{

timeRemaining--;

updateTimerUI();

if(timeRemaining<=0){

clearInterval(timerInterval);

showResults();

}

},1000);

}

function updateTimerUI(){

const minutes=Math.floor(timeRemaining/60);

const seconds=timeRemaining%60;

document.getElementById("time-left").innerText=
`${minutes}:${seconds<10?'0':''}${seconds}`;

const progress=
(timeRemaining/TIME_LIMIT)*100;

document
.getElementById("timer-progress")
.style.width=`${progress}%`;

}

/* RENDER QUESTION */

function renderQuestion(){

if(currentQuestionIndex>=quizData.length){

showResults();

return;

}

const q=quizData[currentQuestionIndex];

let options=[
...q.wrong_answers,
q.correct
];

if(ENABLE_SHUFFLE){

shuffleArray(options);

}

document.getElementById("quiz-container").innerHTML=`

<div class="mb-4">

<p class="text-blue-700 font-bold mb-2">
ප්‍රශ්නය ${currentQuestionIndex+1}
/
${quizData.length}
</p>

<h2 class="text-xl font-bold text-gray-800">
${q.question}
</h2>

</div>

<div class="space-y-3">

${options.map(option=>`

<button
class="option-button"
onclick="checkAnswer(this,'${q.correct}')">

${option}

</button>

`).join("")}

</div>

`;

}

/* CHECK ANSWER */

function checkAnswer(button,correct){

const buttons=
document.querySelectorAll(".option-button");

buttons.forEach(btn=>{

btn.classList.add("disabled");

if(btn.innerText.trim()===correct){

btn.classList.add("correct-answer");

}

});

if(button.innerText.trim()===correct){

score++;

}else{

button.classList.add("incorrect-answer");

}

setTimeout(()=>{

currentQuestionIndex++;

renderQuestion();

},1000);

}

/* RESULTS */

function showResults(){

clearInterval(timerInterval);

document
.getElementById("quiz-container")
.classList.add("hidden");

document
.getElementById("timer-display")
.classList.add("hidden");

document
.getElementById("results-container")
.classList.remove("hidden");

document
.getElementById("display-student-name")
.innerText=studentName;

document
.getElementById("display-student-class")
.innerText=studentClass;

const percentage=
Math.round(
(score/quizData.length)*100
);

document
.getElementById("correct-answers-count")
.innerText=
`නිවැරදි පිළිතුරු : ${score}/${quizData.length}`;

document
.getElementById("final-percentage")
.innerText=
`${percentage}%`;

const now=new Date();

document
.getElementById("result-date")
.innerText=
now.toLocaleString();

}

/* DOWNLOAD RESULT */

function captureResultsAsImage(){

html2canvas(
document.getElementById("result-card-to-capture")
).then(canvas=>{

const link=document.createElement("a");

link.download="result.jpeg";

link.href=
canvas.toDataURL();

link.click();

});

}

/* RESET */

function resetQuizState(){

location.reload();

}

</script>

</body>
</html>
